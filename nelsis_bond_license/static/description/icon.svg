<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <title>nelsis_bond_license</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE047"/><stop offset=".55" stop-color="#F59E0B"/><stop offset="1" stop-color="#92400E"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#92400E"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E3EAF6"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="22" y="12" width="212" height="208" rx="54"/></clipPath>
    <g id="g"><rect x="58" y="62" width="140" height="98" rx="14"/><path d="M138 148 L130 200 L152 186 L174 200 L166 148 Z"/></g>
    <style>
      .float{animation:float 3.6s ease-in-out infinite}
      .glyph{animation:bob 3.6s ease-in-out infinite;animation-delay:.25s}
      .shadow{transform-origin:128px 246px;animation:shadow 3.6s ease-in-out infinite}
      .sweep{animation:sweep 4.8s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}
      @keyframes sweep{0%{transform:translateX(-140px)}55%,100%{transform:translateX(320px)}}
      @media (prefers-reduced-motion:reduce){.float,.glyph,.shadow,.sweep{animation:none}}
    </style>
  </defs>
  <ellipse class="shadow" cx="128" cy="246" rx="84" ry="8" fill="url(#shadow)"/>
  <g class="float">
    <rect x="22" y="26" width="212" height="208" rx="54" fill="url(#side)"/>
    <rect x="22" y="12" width="212" height="208" rx="54" fill="url(#tile)"/>
    <g clip-path="url(#clip)">
      <path d="M22 12 H234 V104 C190 138 70 138 22 104 Z" fill="url(#gloss)" opacity=".55"/>
      <rect class="sweep" x="-60" y="-10" width="46" height="260" fill="url(#sweep)" transform="skewX(-18)"/>
    </g>
    <rect x="24" y="14" width="208" height="204" rx="52" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
    <g class="glyph">
      <g opacity=".28" transform="translate(0 12)"><use href="#g" fill="#000"/></g>
      <use href="#g" y="8" fill="#92400E"/><use href="#g" y="7" fill="#92400E"/><use href="#g" y="6" fill="#92400E"/><use href="#g" y="5" fill="#92400E"/><use href="#g" y="4" fill="#92400E"/><use href="#g" y="3" fill="#92400E"/><use href="#g" y="2" fill="#92400E"/><use href="#g" y="1" fill="#92400E"/>
      <use href="#g" fill="url(#face)"/>
      <rect x="82" y="84" width="92" height="9" rx="4.5" fill="#F59E0B"/><rect x="82" y="104" width="62" height="9" rx="4.5" fill="#F59E0B"/><circle cx="152" cy="138" r="17" fill="#92400E"/><circle cx="152" cy="138" r="8" fill="#fff"/>
    </g>
  </g>
</svg>
